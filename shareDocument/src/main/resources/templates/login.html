<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - DocShare</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-lock-fill fs-2"></i>
                </div>
                <h4 class="fw-bold">DocShare Admin</h4>
                <p class="text-muted small">Đăng nhập hệ thống quản trị</p>
            </div>

            <!-- Bắt lỗi từ Spring Security -->
            <div th:if="${param.error}" class="alert alert-danger py-2 text-center" style="font-size: 14px;">
                Tên đăng nhập hoặc mật khẩu không đúng!
            </div>
            
            <!-- Thông báo đăng xuất thành công -->
            <div th:if="${param.logout}" class="alert alert-success py-2 text-center" style="font-size: 14px;">
                Bạn đã đăng xuất thành công.
            </div>

            <!-- Form gửi dữ liệu (name của input bắt buộc là username và password) -->
            <form th:action="@{/admin/login-process}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 14px;">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required placeholder="Nhập admin username">
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="font-size: 14px;">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                </button>
            </form>
        </div>
    </div>

</body>
</html>
